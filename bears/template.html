<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>theobear: [TITLE]</title>
        <link rel="stylesheet" href="/styles.css"/>
        <link rel="stylesheet" href="poem.css"/>
    </head>
    <body>
        <div class="main-container">
            <div class="frame">
                <img class="corner tl" src="/assets/poem_corner.png">
                <img class="corner tr" src="/assets/poem_corner.png">
                <img class="corner br" src="/assets/poem_corner.png">
                <img class="corner bl" src="/assets/poem_corner.png">
                <i class="bline bleft"></i>
                <i class="bline bright"></i>
                <div class="content">
                    <h1>[TITLE]</h1>
                    [POEM]
                </div>
                <small class="date">[DATE]</small>
            </div>
            <br>
            <div class="gallery">
                <img src="/assets/theobear.jpg">
            </div>
            <div style="padding-top: 50px;" class="line">
                ← <a class="link" href="/poems.html">poems</a>
                •
                <a class="link" href="/">homepage</a> ⌂
            </div>
            <script>
                const galleryImages = document.querySelectorAll('.gallery img');
                galleryImages.forEach(image => {
                    image.addEventListener("click", (event) => {
                        window.open(event.target.src, "_blank");
                    });
                });
            </script>
        </div>
    </body>
</html>
