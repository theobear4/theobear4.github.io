<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>theobear webpage</title>
        <link rel="stylesheet" href="styles.css"/>
        <style>
            :root {
                /* GOD BLESS AMERICA */
                --beehive-width: 416px;
                --beehive-height: 464px;
            }

            .title {
                margin: 0 auto;
            }

            body {
                margin: 0;
                width: 100%;
                overflow-x: clip;
            }

            .main-container {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                text-align: center;
                overflow-x: clip;
            }

            #beehive {
                position: relative;
                width: var(--beehive-width);
                height: var(--beehive-height);
                flex-shrink: 0;
                zoom: min(1, calc((100vw - 20px) / var(--beehive-width)));
                margin: 0 auto;
            }

            .hex {
                position: absolute;
                width: 20px;
                height: 24px;
                background-color: rgb(231, 182, 228);
                clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); /* <- plug this into desmos to show theo */
            }

            .content {
                position: absolute;
                inset: 0;
                margin: auto;
                width: 60%;
                height: 45%;
                box-sizing: border-box;
                padding: 16px;
                overflow-y: auto;
                z-index: 1;
                background-color: #fbdbff;
                display: flex;
                flex-direction: column;
                justify-content: safe center;
                align-items: center;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="main-container">
            <div id="beehive">
                <div class="content">
                    <h1 class="title">welcome...</h1>
                    <p>[introducing myself]</p>
                    <a href="poems.html">poezia mea</a>
                </div>
            </div>
            <img style="padding-top: 20px; width: 50%;" src="assets/theobear.jpg">
        </div>
        <script>
            const w = 20, h = 24;   // hex w and h
            const dx = 22, dy = 20; // spacing between hex

            const beehive = document.getElementById("beehive");

            // AMERICAN INNOVATION
            const styles = getComputedStyle(beehive);
            const width = parseFloat(styles.width);
            const height = parseFloat(styles.height);

            // oval dims
            const cx = width / 2;
            const cy = height / 2;
            const a = width / 2 - 28;
            const b = height / 2 - 8;

            // hex gen
            for (let r = 0; r * dy < height; r++) {
                for (let c = 0; c * dx < width; c++) {
                    const x = c * dx + (r % 2) * (dx / 2);
                    const y = r * dy;

                    const nx = (x + w / 2 - cx) / a;
                    const ny = (y + h / 2 - cy) / b;

                    if (nx * nx + ny * ny <= 1) {
                        const hex = document.createElement("div");
                        hex.className = "hex";
                        hex.style.left = x + "px";
                        hex.style.top = y + "px";
                        beehive.appendChild(hex);
                    }
                }
            }
        </script>
    </body>
</html>
